<mat-toolbar class="topbar gap-8">
  <!-- Mobile Menu -->
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex justify-content-center">
    <i class="iconify icon-20 d-flex" data-icon="solar:hamburger-menu-line-duotone"></i>
  </button>

  <span class="flex-1-auto"></span>

  <button mat-icon-button [matMenuTriggerFor]="helpmenu" class="d-flex justify-content-center" matTooltip="Ayuda">
    <i class="iconify icon-22 d-flex" data-icon="solar:question-circle-line-duotone"></i>
  </button>
  <mat-menu #helpmenu="matMenu" class="topbar-dd cardWithShadow" >
    <div class="menu-item" (click)="downloadPlantillaExcel()">
      <span style="width: 70%;">Plantilla de Excel para importar indicadores</span>
      <mat-icon class="d-flex align-items-center"><i data-icon="solar:download-square-linear" class="iconify icon-32"></i> </mat-icon>
    </div>

    <!-- <div class="menu-item">
      Iniciar tour
      <mat-icon class="d-flex align-items-center"><i data-icon="solar:tram-line-duotone" class="iconify icon-32"></i> </mat-icon>
    </div> -->
  </mat-menu>

  <!-- --------------------------------------------------------------- -->
  <!-- Profile Button -->
  <!-- --------------------------------------------------------------- -->
  <button mat-icon-button extended [matMenuTriggerFor]="profilemenu" aria-label="Profile"
    class="d-flex align-items-center justify-content-center profile-btn-dd">
    <div class="initials-avatar">
      {{ getInitials() }}
    </div>
  </button>

  <mat-menu #profilemenu="matMenu" class="topbar-dd cardWithShadow">
    <div class="d-flex align-items-center p-12 b-b-1 m-x-12">
      <div class="">
        <h4 class="m-b-0 text-center">{{ user?.grade || '' }} {{ user?.name?.fullName || 'Usuario' }}</h4>
        <div class="dep-info">
          <p class="b-b-1 p-b-10  m-y-10">
            {{ user?.position }}
          </p>
          <h5>
            {{ user?.department }}
          </h5>
        </div>
      </div>
    </div>

    <!-- Theme Selector -->
    <div class="menu-item" (click)="$event.stopPropagation()">
      <span class="theme-label"> Cambiar tema</span>
      <div class="theme-toggle-box" (click)="toggleTheme()">
        <div class="theme-icon-container" [class.active]="isDarkTheme">
          <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px">
            <rect fill="none" height="24" width="24" />

            C17.45,17.19,14.93,19,12,19c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9
            s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4

          </svg>
        </div>
        <div class="theme-icon-container" [class.active]="!isDarkTheme">
          <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 0 24 24" width="20px">
            <rect fill="none" height="24" width="24" />

            c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0
            l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z" />
          </svg>
        </div>
      </div>
    </div>

    <div class="menu-item" routerLink="/change-password">
      Actualizar contraseña
      <mat-icon class="d-flex align-items-center"><i data-icon="solar:lock-password-line-duotone"
          class="iconify icon-22"></i> </mat-icon>
    </div>


    <div class="p-x-12 m-t-12">
      <a mat-stroked-button (click)="logout()" class="w-100">Cerrar sesión</a>
    </div>
  </mat-menu>
</mat-toolbar>
